<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Create your profile — TAYORA</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <header class="site-header">
        <a class="brand" href="../index.html">TAYORA<span>.</span></a>
        <nav><a href="dashboard.html">Dashboard</a></nav>
    </header>
    <main class="page-wrap">
        <p class="eyebrow">LET'S MAKE IT PERSONAL</p>
        <h1>Create your profile</h1>
        <p class="page-intro">Share a few preferences to shape your grooming and style experience. Your profile stays in this browser.</p>

        <form class="panel" id="profile-form" data-redirect="dashboard.html">
            <div class="form-grid">
                <div class="field">
                    <label for="age">Age (optional)</label>
                    <input id="age" type="number" min="13" max="120" placeholder="e.g. 22">
                </div>
                <div class="field">
                    <label for="gender">Gender (optional)</label>
                    <select id="gender">
                        <option value="">Prefer not to say</option>
                        <option>Woman</option><option>Man</option><option>Non-binary</option><option>Other</option>
                    </select>
                </div>
                <div class="field">
                    <label for="skin">Skin type</label>
                    <select id="skin">
                        <option>Not sure</option><option>Dry</option><option>Oily</option><option>Combination</option><option>Normal</option><option>Sensitive</option>
                    </select>
                </div>
                <div class="field">
                    <label for="hair">Hair type</label>
                    <select id="hair">
                        <option>Not sure</option><option>Straight</option><option>Wavy</option><option>Curly</option><option>Coily</option>
                    </select>
                </div>
                <div class="field">
                    <label for="face">Face shape (optional)</label>
                    <select id="face">
                        <option>Not sure</option><option>Uncertain</option><option>Oval</option><option>Round</option><option>Square</option><option>Rectangular</option><option>Heart</option><option>Diamond</option>
                    </select>
                </div>
                <div class="field">
                    <label for="budget">Monthly budget (₹, optional)</label>
                    <input id="budget" type="number" min="0" placeholder="e.g. 1500">
                </div>
                <div class="field">
                    <label for="concerns">Skin or hair concerns (optional)</label>
                    <input id="concerns" placeholder="e.g. dryness, frizz">
                </div>
                <div class="field">
                    <label for="style">Clothing preference</label>
                    <select id="style">
                        <option>Casual</option><option>Minimal</option><option>Streetwear</option><option>Formal</option><option>Traditional</option><option>Experimental</option>
                    </select>
                </div>
            </div>
            <p class="form-actions"><button class="button" type="submit">Save profile and continue</button></p>
            <p class="notice">Your profile is stored on this device in this browser. You can choose “Not sure” and update it later.</p>
        </form>
    </main>
    <script src="../js/app.js"></script>
</body>
<script>
document.getElementById("profile-form").addEventListener("submit", function(event) {
    event.preventDefault();

    const profile = {
        age: document.getElementById("age").value,
        gender: document.getElementById("gender").value,
        skin: document.getElementById("skin").value,
        hair: document.getElementById("hair").value,
        face: document.getElementById("face").value,
        budget: document.getElementById("budget").value,
        concerns: document.getElementById("concerns").value,
        style: document.getElementById("style").value
    };

    localStorage.setItem("tayoraProfile", JSON.stringify(profile));

    document.getElementById("profile-message").textContent =
        "Your profile has been saved successfully!";
});
</script>
</html>
