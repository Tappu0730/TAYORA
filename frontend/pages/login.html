<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign in — TAYORA</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <header class="site-header">
        <a class="brand" href="../index.html">TAYORA<span>.</span></a>
        <nav><a href="../index.html">Home</a><a href="register.html">Create account</a></nav>
    </header>
    <main class="page-wrap">
        <p class="eyebrow">YOUR PERSONAL STYLE GUIDE</p>
        <h1>Welcome back.</h1>
        <p class="page-intro">Sign in to access your profile, saved looks and digital wardrobe from any device.</p>
        <section class="panel">
            <form id="login-form">
                <div class="field">
                    <label for="login-email">Email</label>
                    <input id="login-email" type="email" autocomplete="email" required>
                </div>
                <div class="field">
                    <label for="login-password">Password</label>
                    <input id="login-password" type="password" autocomplete="current-password" minlength="8" required>
                </div>
                <p class="form-actions"><button class="button" type="submit">Sign in</button></p>
                <p id="login-status" class="notice" role="status" aria-live="polite"></p>
            </form>
        </section>
    </main>
    <script src="../js/config.js"></script>
    <script src="../js/auth.js"></script>
    <script>
        const loginForm = document.getElementById("login-form");
        const loginStatus = document.getElementById("login-status");
        loginForm.addEventListener("submit", async (event) => {
            event.preventDefault();
            loginStatus.textContent = "Signing in...";
            try {
                const response = await window.TAYORA_AUTH.apiFetch("/auth/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        email: document.getElementById("login-email").value,
                        password: document.getElementById("login-password").value
                    })
                });
                const result = await response.json();
                if (!response.ok) throw new Error(result.detail || "Sign in failed.");
                window.TAYORA_AUTH.setSession(result);
                window.location.href = "dashboard.html";
            } catch (error) {
                loginStatus.textContent = error.message;
            }
        });
    </script>
</body>
</html>
